selection_rule: >-
  One nearby weekday per calendar month at exactly 8:30 a.m. Eastern. The BLS,
  Census, BEA, and Federal Reserve scheduled-release calendars were screened for
  an announcement at that exact clock time. Candidate controls on June 26, July
  24, and September 25, 2024 were rejected after the screen identified BEA or
  Census releases at 8:30 a.m. January 7, 2025 was rejected because the
  international-trade release occurred at that clock; January 8 is used instead.
  The screen cannot exclude unscheduled information and does not assert that any
  entire day was news-free.

