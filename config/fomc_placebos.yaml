source_urls:
  federal_reserve_calendar: https://www.federalreserve.gov/newsevents/calendar.htm
  treasury_mts_schedule: https://www.fiscal.treasury.gov/files/reports-statements/mts/mts1124.pdf
selection_rule: >-
  Same weekday and exact 2:00 p.m. Eastern clock time, as close as practical to
  the matched meeting. Dates with an FOMC decision, FOMC minutes, Beige Book,
  SCOOS, or a 2:00 p.m. Monthly Treasury Statement release are excluded. The
  screen covers scheduled official releases; unscheduled news cannot be ruled
  out and is retained as a limitation rather than assumed absent.
notes: >-
  March 12 and June 11, 2025 were rejected because the Monthly Treasury
  Statement was scheduled for 2:00 p.m. December 11, 2024 was also not used
  because the nearby Treasury release schedule was not cleanly distinguishable
  from the event clock. November 27 is retained as a secondary control but
  flagged as a pre-holiday session.

